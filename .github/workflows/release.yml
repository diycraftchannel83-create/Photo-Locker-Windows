name: Windows Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag_name:
        description: "Release tag (e.g. v0.1.0)"
        required: true
        default: "v0.1.0"
        type: string

permissions:
  contents: write

jobs:
  build-release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: "8.14"
      - name: Run tests
        run: gradle --no-daemon test
      - name: Package MSI and EXE
        run: gradle --no-daemon packageDistributionForCurrentOS
      - name: Find release installers
        shell: pwsh
        run: |
          $files = Get-ChildItem -Path "app/build/compose/binaries/main" -Recurse -Include *.msi,*.exe
          if (-not $files -or $files.Count -eq 0) {
            throw "No MSI or EXE installers found."
          }
          New-Item -ItemType Directory -Force -Path "release-assets" | Out-Null
          $files | Copy-Item -Destination "release-assets"
          Get-ChildItem "release-assets"
      - name: Create GitHub Release and upload installers
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event_name == 'workflow_dispatch' && inputs.tag_name || github.ref_name }}
          target_commitish: main
          files: release-assets/*
          generate_release_notes: true
          draft: false
          prerelease: false
