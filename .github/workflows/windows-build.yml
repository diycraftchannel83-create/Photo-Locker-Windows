name: Windows Desktop CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Setup Gradle 8.14
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.14'
      - name: Build and package Windows app
        run: gradle --no-daemon packageDistributionForCurrentOS
      - name: Upload package
        uses: actions/upload-artifact@v4
        with:
          name: Photo-Locker-Windows-package
          path: app/build/compose/binaries/main/**/*
          if-no-files-found: error
