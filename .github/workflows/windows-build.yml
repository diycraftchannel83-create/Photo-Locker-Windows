name: Windows Desktop CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.14'
      - name: Run unit tests
        run: gradle --no-daemon test
      - name: Package Windows app
        run: gradle --no-daemon packageDistributionForCurrentOS
      - uses: actions/upload-artifact@v4
        with:
          name: Photo-Locker-Windows-package
          path: app/build/compose/binaries/main/**/*
          if-no-files-found: error
